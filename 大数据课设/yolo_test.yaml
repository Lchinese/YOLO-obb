# YOLO OBB 训练配置文件
# 数据集路径
path: d:/Project/大数据课设/dataset  # 数据集根目录
train: images/train  # 训练集图片相对路径
val: images/val      # 验证集图片相对路径

# 类别信息
nc: 3  # 类别数量
names:
  - car
  - pedestrian
  - two-wheeler

# 任务类型（旋转目标检测）
task: obb
obb: true

# 训练参数（可选，可在train.py中覆盖）
# epochs: 100
# batch: 16
# imgsz: 640
